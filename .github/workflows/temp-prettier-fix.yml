name: Temporary Prettier Fix

on:
  push:
    branches:
      - fix/prompt-queue-run-state

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/prompt-queue-run-state

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed TypeScript files
        run: >-
          pnpm exec prettier --write
          src/core/chatgpt-run-state.ts
          src/core/queue-dispatch-readiness.ts
          src/core/queue-dispatcher.ts
          src/core/queue-submit.ts

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- \
            src/core/chatgpt-run-state.ts \
            src/core/queue-dispatch-readiness.ts \
            src/core/queue-dispatcher.ts \
            src/core/queue-submit.ts; then
            echo "No formatting changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/core/chatgpt-run-state.ts \
            src/core/queue-dispatch-readiness.ts \
            src/core/queue-dispatcher.ts \
            src/core/queue-submit.ts
          git commit -m "style: format queue run-state changes"
          git push origin HEAD:fix/prompt-queue-run-state
